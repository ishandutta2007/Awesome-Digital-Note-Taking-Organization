<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f8fafc;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #cbd5e1;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC AMBIENT GLOW ORBS (Background) -->
  <g opacity="0.45" filter="url(#softGlow)">
    <circle cx="200" cy="100" r="120" fill="#38bdf8">
      <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;160;100" dur="10s" repeatCount="indefinite" />
      <animate attributeName="r" values="110;140;110" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="300" r="140" fill="#a855f7">
      <animate attributeName="cx" values="1020;960;1020" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;240;300" dur="11s" repeatCount="indefinite" />
      <animate attributeName="r" values="130;160;130" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="360" r="110" fill="#6366f1">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- DYNAMIC KNOWLEDGE GRAPH & DATA FLOWS (Background layer behind text) -->
  <g opacity="0.35">
    <!-- Connecting Link Lines with Dash Animation -->
    <line x1="900" y1="90" x2="1060" y2="130" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="36;0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="1060" y1="130" x2="1110" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="36;0" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="1060" y1="130" x2="960" y2="220" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="6s" repeatCount="indefinite" />
    </line>
    <line x1="960" y1="220" x2="1020" y2="330" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="36;0" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="1020" y1="330" x2="880" y2="340" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" values="30;0" dur="7s" repeatCount="indefinite" />
    </line>

    <!-- Graph Nodes with pulsing effects -->
    <g transform="translate(900, 90)">
      <circle r="22" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
      <circle r="7" fill="#818cf8">
        <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite" />
      </circle>
      <text y="36" text-anchor="middle" class="node-text">Markdown</text>
    </g>

    <g transform="translate(1060, 130)">
      <circle r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <circle r="9" fill="#38bdf8">
        <animate attributeName="r" values="7;11;7" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text y="42" text-anchor="middle" class="node-text">Backlinks</text>
    </g>

    <g transform="translate(960, 220)">
      <circle r="20" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
      <circle r="6" fill="#c084fc">
        <animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text y="34" text-anchor="middle" class="node-text">Canvas</text>
    </g>

    <g transform="translate(1110, 240)">
      <circle r="22" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
      <circle r="7" fill="#06b6d4">
        <animate attributeName="r" values="6;9;6" dur="4s" repeatCount="indefinite" />
      </circle>
      <text y="36" text-anchor="middle" class="node-text">Local-First</text>
    </g>

    <g transform="translate(1020, 330)">
      <circle r="24" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
      <circle r="8" fill="#a855f7">
        <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite" />
      </circle>
      <text y="38" text-anchor="middle" class="node-text">Second Brain</text>
    </g>
  </g>

  <!-- LEFT DECORATIVE ACCENT: Animated Flowing Dots -->
  <g opacity="0.3">
    <circle cx="80" cy="80" r="3" fill="#38bdf8">
      <animate attributeName="cy" values="60;140;60" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="180" r="4" fill="#818cf8">
      <animate attributeName="cy" values="160;240;160" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="90" cy="300" r="3.5" fill="#c084fc">
      <animate attributeName="cy" values="280;340;280" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed sharp, clean, high-contrast & unobstructed -->
  <g transform="translate(90, 85)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="tagline-text">Curated Ecosystem Guide</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="url(#textGrad)" class="title-text">
      Awesome Digital Note-Taking
    </text>
    <text x="0" y="145" fill="#f8fafc" class="title-text">
      &amp; Knowledge Organization
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">
      SaaS Platforms &amp; Open-Source Tools • Local-First PKM • Second Brain • Bidirectional Graphs
    </text>

    <!-- Feature Badges / Pills -->
    <g transform="translate(0, 235)">
      <!-- Pill 1: Local-First -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="65" y="22" text-anchor="middle" class="pill-text">💾 Local-First</text>
      </g>
      <!-- Pill 2: Markdown -->
      <g transform="translate(142, 0)">
        <rect width="125" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="62.5" y="22" text-anchor="middle" class="pill-text">📝 Markdown</text>
      </g>
      <!-- Pill 3: E2E Encrypted -->
      <g transform="translate(279, 0)">
        <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72.5" y="22" text-anchor="middle" class="pill-text">🔐 E2E Encrypted</text>
      </g>
      <!-- Pill 4: Knowledge Graph -->
      <g transform="translate(436, 0)">
        <rect width="165" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="82.5" y="22" text-anchor="middle" class="pill-text">🕸️ Knowledge Graph</text>
      </g>
      <!-- Pill 5: Open-Source -->
      <g transform="translate(613, 0)">
        <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="70" y="22" text-anchor="middle" class="pill-text">⚡ Open-Source</text>
      </g>
    </g>
  </g>
</svg>